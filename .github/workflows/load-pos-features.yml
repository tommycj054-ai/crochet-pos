name: Load POS feature script
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  load-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add feature script to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="pos-features.js"></script>'
          if tag not in s:
              s = s.replace('<script src="app.js"></script>', '<script src="app.js"></script>\n' + tag)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load POS feature upgrades'
          git push
